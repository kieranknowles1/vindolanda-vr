<html>
  
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../../../style.css">
    <base target="_parent">
    <title data-trilium-title>Animations</title>
  </head>
  
  <body>
    <div class="content">
       <h1 data-trilium-h1>Animations</h1>

      <div class="ck-content">
        <p>Animations are sourced from <a href="https://mixamo.com">Mixamo</a>
        </p>
        <ul>
          <li>Download animation WITHOUT SKIN</li>
          <li>Import to unity</li>
          <li>Set animation type to <strong>Humanoid</strong>
          </li>
          <li>Set avatar definition to <strong>Copy &nbsp;from Other Avatar</strong> and
            source to <code>Soldier01Avatar</code>
          </li>
          <li>If applicable, enable <strong>Animation</strong> → <strong>Loop Time</strong>
          </li>
        </ul>
      </div>
    </div>
  </body>

</html>
